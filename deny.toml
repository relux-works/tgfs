# cargo-deny configuration — the workspace supply-chain gate (NFR-050).
#
# Four checks, all part of `.scripts/acceptance/run_automated.py --suite core`:
#
#   licenses    POL-6 (DEC-018): permissive-licensed dependencies only.
#   advisories  Known vulnerabilities and unmaintained crates (RustSec).
#   bans        Duplicate and wildcard dependencies.
#   sources     Where code is allowed to come from.
#
# Run: cargo deny check                       (all four)
#      cargo deny check licenses              (one)
#
# cargo-deny is the only tool here rather than cargo-audit + cargo-deny: both
# read the same RustSec database, and `cargo deny check advisories` covers what
# `cargo audit` reports. One tool means one config file, one version to pin,
# and one place a rule can hide. Minimum version 0.18 — the `[advisories]`
# schema below (no `vulnerability`/`unsound`/`notice` keys) is rejected by
# older releases; `.scripts/check_toolchain.py` enforces the floor.
#
# Determinism note: licenses, bans and sources are hermetic — same commit, same
# verdict, forever. `advisories` is deliberately not: it is evaluated against a
# database that changes, so a commit that passes today can fail tomorrow when a
# CVE lands. That is the point of the check, not a flaw in it.

[graph]
# Evaluate every feature combination a consumer could enable, so a
# platform- or feature-gated dependency cannot smuggle in a license.
all-features = true

# ---------------------------------------------------------------------------
# Licenses — POL-6 (DEC-018)
#
# The product is proprietary; every third-party dependency must carry a
# permissive license. The allow list is exactly the POL-6 set (BSD expressed as
# its 2- and 3-clause SPDX forms). Any other license — including permissive ones
# outside this set — fails the gate and requires an explicit owner-approved
# decision row in .spec/decisions.md before being added here.
#
# GPL/AGPL/LGPL-static sources (tdesktop, tdl, MadelineProto) are reference-only
# under POL-6. They are absent from this list on purpose: the gate is what makes
# "never linked or vendored" a fact rather than an intention.
# ---------------------------------------------------------------------------

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "Zlib",
    "ISC",
]
# Workspace crates are proprietary and unpublished (publish = false);
# they are the product, not dependencies, so the gate skips them.
private = { ignore = true }
# Allow-list entries may be unused while the dependency tree is small.
unused-allowed-license = "allow"

# POL-6 named exceptions (DEC-021, owner-accepted 2026-07-17).
#
# Two licenses outside the POL-6 permissive set are allowed, and only for the
# crates named here:
#
#   MPL-2.0      the uniffi crate family — the accepted FFI bridge (DEC-001).
#                Weak copyleft scoped to the covered *files*, not to the work
#                that links them, so it does not reach our proprietary code.
#                The obligation is conditional: modifying a covered file means
#                publishing that file. We use these crates unmodified.
#   Unicode-3.0  unicode-ident — proc-macro infrastructure under syn/quote.
#                Compile-time only; never linked into a shipped artifact.
#                Its expression is `(MIT OR Apache-2.0) AND Unicode-3.0`, so the
#                MIT half resolves against `allow` above and only the Unicode-3.0
#                term needs the exception.
#
# `exceptions` rather than `allow` entries on purpose: DEC-021 grants these
# licenses to *named crates*, not to the dependency tree at large. A blanket
# allow would let any future crate carry MPL-2.0 in silently, which is the
# outcome the decision row exists to prevent.
#
# Names are unversioned, matching [bans.build] below: the grant is about *which*
# crates may carry these licenses, and a patch bump must not flip the gate. A
# new uniffi_* crate appearing on a version bump fails here until it is added on
# purpose — that review is the feature.
exceptions = [
    { allow = ["MPL-2.0"], crate = "uniffi" },
    { allow = ["MPL-2.0"], crate = "uniffi_bindgen" },
    { allow = ["MPL-2.0"], crate = "uniffi_core" },
    { allow = ["MPL-2.0"], crate = "uniffi_internal_macros" },
    { allow = ["MPL-2.0"], crate = "uniffi_macros" },
    { allow = ["MPL-2.0"], crate = "uniffi_meta" },
    { allow = ["MPL-2.0"], crate = "uniffi_pipeline" },
    { allow = ["MPL-2.0"], crate = "uniffi_udl" },
    { allow = ["Unicode-3.0"], crate = "unicode-ident" },
]

# ---------------------------------------------------------------------------
# Advisories — known vulnerabilities and unmaintained crates
#
# Vulnerabilities are always an error in cargo-deny 0.18+ and have no severity
# threshold to relax, which matches the release gate in
# .spec/quality-and-release.md: no unresolved critical/high security findings.
#
# An advisory that genuinely does not apply is silenced by adding its RRUSTSEC ID
# to `ignore` below WITH a comment stating why it cannot reach us — never by
# lowering a level. An empty `ignore` list is the healthy state.
# ---------------------------------------------------------------------------

[advisories]
# A yanked dependency is a supply-chain signal, not a nuisance: the author
# pulled that exact version for a reason.
yanked = "deny"
# Unmaintained crates matter where we chose them. A transitive unmaintained
# crate deep in someone else's tree is a warning we cannot act on directly, so
# it is not a build-stopper — "workspace" scopes the error to our own choices.
unmaintained = "workspace"
ignore = []

# ---------------------------------------------------------------------------
# Bans — dependency-tree shape
# ---------------------------------------------------------------------------

[bans]
# Two versions of the same crate is normal in a young tree and usually a
# transitive constraint we cannot fix by editing our own manifest. Warn so it
# stays visible and gets pruned deliberately; do not fail a build on it.
multiple-versions = "warn"
# A wildcard version is not a dependency, it is a promise to break later.
wildcards = "deny"
# ...except between our own crates. `{ workspace = true }` on a path dependency
# carries no version requirement, so cargo-deny reads all seven internal edges
# as wildcards. They are not: the seven crates version and ship as one unit, and
# the edges are constrained by .scripts/check_crate_architecture.py instead.
# This exemption applies only to path dependencies of private (publish = false)
# crates, so it cannot silently excuse a wildcard on a registry dependency.
allow-wildcard-paths = true
deny = []

[bans.build]
# Build scripts execute arbitrary code at compile time on developer machines and
# CI runners. Every entry below arrived with the UniFFI boundary
# (TASK-260715-265gqq, as this comment predicted) or with the proptest dev
# tree (TASK-260715-1qz1g5) and is a version/feature probe or cfg emitter —
# none generates bindings or touches the network.
# Entries are name-level, not version-pinned: the ban is about *which* crates
# may run code at build time, and a routine patch bump must not flip this
# gate. A new name still fails until it is added here on purpose.
allow-build-scripts = [
    # Proc-macro infrastructure under uniffi_macros/serde_derive/syn.
    # Compile-time only; never linked into a shipped artifact.
    "proc-macro2",
    "quote",
    "camino",
    "fs-err",
    # uniffi runtime tree: anyhow directly; serde/serde_core/serde_json/
    # thiserror/zmij via cargo_metadata (uniffi's default `cargo-metadata`
    # feature); getrandom/rustix/libc via tempfile (uniffi_pipeline).
    "anyhow",
    "serde",
    "serde_core",
    "serde_json",
    "thiserror",
    "zmij",
    "getrandom",
    "rustix",
    "libc",
    # proptest dev tree (dev-dependency of gramdrive-model; never a product
    # dependency, so none of this reaches a shipped artifact):
    # num-traits probes rustc features via autocfg; zerocopy (under
    # ppv-lite86/rand_chacha) emits version cfgs; wit-bindgen is getrandom's
    # WASI-target dependency — in the graph for completeness, never compiled
    # for a GramDrive target.
    "num-traits",
    "zerocopy",
    "wit-bindgen",
    # SQLite tree (rusqlite `bundled`, the state store — TASK-260715-1ceq7h).
    # libsqlite3-sys's build script compiles the vendored public-domain
    # SQLite amalgamation with cc; it generates no bindings and touches no
    # network. The wasm names below are libsqlite3-sys's
    # wasm32-unknown-unknown fallback (sqlite-wasm-rs and its wasm-bindgen
    # tree, with rustversion's compiler probe) — in the graph for
    # completeness, never compiled for a GramDrive target.
    "libsqlite3-sys",
    "sqlite-wasm-rs",
    "wasm-bindgen",
    "wasm-bindgen-shared",
    "rustversion",
]

# ---------------------------------------------------------------------------
# Sources — where code may come from
#
# crates.io only. A git dependency bypasses the registry's immutability: a
# force-pushed tag changes what a pinned revision resolves to, and no license
# or advisory metadata is guaranteed. Adding a git source is an architecture
# decision, so the gate demands it be written down here first.
# ---------------------------------------------------------------------------

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
