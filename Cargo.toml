# GramDrive shared Rust core workspace.
#
# Architecture, dependency-direction rules, and feature policy: crates/README.md.
# Layering is enforced by `python3 .scripts/check_crate_architecture.py`.
# Supply-chain gate (POL-6): deny.toml, run with `cargo deny check`.
# Toolchain pin: rust-toolchain.toml. Every gate: `.scripts/acceptance/run_automated.py`.

[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
publish = false

[workspace.dependencies]
gramdrive-model = { path = "crates/gramdrive-model" }
gramdrive-source = { path = "crates/gramdrive-source" }
gramdrive-state = { path = "crates/gramdrive-state" }
gramdrive-render = { path = "crates/gramdrive-render" }
gramdrive-engine = { path = "crates/gramdrive-engine" }
gramdrive-ffi = { path = "crates/gramdrive-ffi" }
gramdrive-testkit = { path = "crates/gramdrive-testkit" }

# External dependencies. Versions live here so every crate that pulls one in
# agrees on the requirement; per-crate manifests add only features.
#
# uniffi is MPL-2.0 — outside the POL-6 allow list, and allowed as an
# owner-accepted named exception (DEC-021). deny.toml grants it per-crate via
# [licenses.exceptions], so the grant reaches only the uniffi* crates named
# there; a new one fails the gate until it is added on purpose.
uniffi = { version = "0.32" }
tokio = { version = "1.52", default-features = false }

# Unicode tables for the naming policy (SYNC-013). All three carry licenses
# inside the POL-6 allow list (MIT OR Apache-2.0, and MIT for caseless), so
# none needs a DEC-021-style exception. They are data, not logic: NFC,
# grapheme-cluster boundaries and the case-folding map are UCD tables that
# cannot be hand-written correctly, and getting them wrong means a name that a
# filesystem silently rewrites, a truncation that splits an emoji, or two
# chats that collapse into one folder.
#
# `default-features = false` where it is offered — the default features pull in
# std-only conveniences the policy does not use. caseless offers no such knob
# and re-enables unicode-normalization's defaults transitively; harmless, since
# the model crate is std anyway, and noted so the next reader does not read the
# flag above as a guarantee.
unicode-normalization = { version = "0.1", default-features = false }
unicode-segmentation = { version = "1.13", default-features = false }
# CaseFolding.txt, which the naming policy needs and the other two do not
# carry: APFS folds sibling names by full Unicode case folding, and no
# combination of to_lowercase/to_uppercase reproduces it (`ẞ` folds to `ss`,
# which neither mapping reaches). See Platform::fold.
caseless = { version = "0.2" }

# Dev-dependency only (property tests). `std` without the default `fork`/
# `timeout` features: forked test processes add child-process machinery
# (rusty-fork, wait-timeout) the tests do not need, and every dependency is
# supply-chain surface the deny gate then has to carry.
proptest = { version = "1.8", default-features = false, features = ["std"] }

# ---------------------------------------------------------------------------
# Lints
#
# Levels live here rather than in a CI flag so that every consumer of the
# manifest — cargo, rust-analyzer, an editor running clippy on save — agrees
# with the gate. Each crate opts in with `[lints] workspace = true`; a crate
# that omits it silently loses the whole set, which is why
# .scripts/check_crate_architecture.py fails a crate that forgets the opt-in.
#
# `-D warnings` in the lint gate covers everything warn-by-default on top of
# what is enumerated here. The enumerated lints are the ones that are *not*
# on by default and that map to a stated project requirement.
# ---------------------------------------------------------------------------

[workspace.lints.rust]
# Public API of the core is consumed through generated Swift/Kotlin bindings,
# where a doc comment is the only documentation a native caller ever sees.
missing_docs = "warn"
missing_debug_implementations = "warn"
# `pub` on an item nothing re-exports means the module tree lies about the
# crate's surface; the FFI boundary (DEC-003) depends on that surface being
# exactly what it claims.
unreachable_pub = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
# Correctness, suspicious, style, complexity and perf: hard errors, not advice.
all = { level = "deny", priority = -1 }

# A panic in the core is not a local failure. Across the UniFFI boundary it is
# an aborted File Provider extension or a lost error category (NFR-030), and
# NFR-025/NFR-033 require callbacks to fail with a category rather than die.
# Tests are exempt via clippy.toml.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

# The core is a library linked into someone else's process: it has no console.
# Diagnostics belong in structured errors and health data (NFR-030, NFR-032),
# and a stray print in a File Provider extension goes nowhere a user can read.
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"

# ---------------------------------------------------------------------------
# Build profiles
# ---------------------------------------------------------------------------

[profile.dev]
# Cargo defaults are right for the debug loop; overriding them would only
# trade compile time for runtime the debug loop does not need.

[profile.test]
# Inherits `dev`. Stated explicitly because the core's arithmetic is offsets,
# quota accounting and cursors: silent wrapping there produces a wrong byte
# range rather than a crash, and NFR-010/NFR-012 depend on catching that in a
# test rather than in a user's Finder.
overflow-checks = true
debug-assertions = true

[profile.release]
# Cross-crate inlining across the seven crates at a fraction of "fat" LTO's
# link time.
#
# Cargo omits `-C lto` when a single rustc invocation also produces an rlib,
# because rustc cannot LTO an rlib output. gramdrive-ffi is `crate-type =
# ["lib", "staticlib", "cdylib"]` (rlib for the Windows/Linux hosts,
# staticlib/cdylib for UniFFI), so a plain `cargo build` of it links without LTO
# and cargo says nothing about it.
#
# SETTLED (TASK-260715-3akqs8): the packaging pipeline builds the shipped
# library with `cargo rustc --crate-type staticlib`, which emits only the type
# that ships and restores the setting — verified: `-C lto=thin` appears in the
# rustc invocation only with that override. So this is live for the artifact,
# and inert for the debug/test builds that never ship. No architecture change
# was needed: the crate keeps every crate-type its consumers need, and packaging
# asks for the one it ships (.scripts/packaging/README.md).
lto = "thin"
codegen-units = 1

# Integer overflow traps in shipped builds too. This is a deliberate trade of
# a few percent throughput against the NFR-012 guarantee that partial or wrong
# content is never published: a wrapped offset in hydration or eviction is a
# silent data error, and the performance budgets (NFR-020..NFR-022) are
# provisional and I/O-bound, not arithmetic-bound. Revisit only with measured
# evidence that this is what costs a budget.
overflow-checks = true

# Panics must unwind. UniFFI converts a panic into an FFI error via
# `catch_unwind`; `panic = "abort"` would turn a recoverable binding error
# into a crash of the host app or extension. TASK-260715-265gqq depends on this.
panic = "unwind"

# Enough to symbolicate a crash report from the shipped dylib without carrying
# full DWARF. Stripping and dSYM handling belong to artifact packaging
# (TASK-260715-3akqs8), which owns what actually ships.
debug = "line-tables-only"

[profile.bench]
# Inherits `release`, including overflow-checks — a benchmark of code that is
# not the shipped code measures nothing.
