[package]
name = "gramdrive-engine"
description = "GramDrive transfer and cache engine: hydration, quota, eviction, resumable downloads"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
gramdrive-model = { workspace = true }
gramdrive-render = { workspace = true }
gramdrive-source = { workspace = true }
gramdrive-state = { workspace = true }

[dev-dependencies]
# Deterministic fake source, executor, and recording sink for the fetch
# coordinator's tests. Dev-only by architecture rule (crates/README.md):
# test support never ships in a product artifact.
gramdrive-testkit = { workspace = true }

[lints]
# Shared lint set: Cargo.toml [workspace.lints].
workspace = true
