name: Bug report
description: Report a reproducible product or documentation problem.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, Telegram session data, phone numbers, message content, file names, diagnostic archives, or other personal data. Use a private security advisory for security-sensitive reports.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Describe the observed behavior without personal or account data.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide a minimal, sanitized reproduction.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
