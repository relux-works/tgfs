name: candidate-build

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: Embedded update trust channel
        required: true
        type: choice
        options:
          - test
          - stable-candidate
      commit:
        description: Full commit SHA reachable from protected origin/main
        required: true
        type: string

permissions:
  contents: read

# Candidate handoff and stable publication share this non-cancelling group so a
# selected build cannot be consumed between final verification and upload.
concurrency:
  group: gramdrive-sparkle-publication-handoff
  cancel-in-progress: false

jobs:
  candidate:
    name: verified-macos-candidate
    runs-on: [self-hosted, gramdrive-mac]
    # The gramdrive-mac label belongs to one dedicated runner account. This
    # second fixed group isolates its signing credential window from any other
    # candidate job in addition to the cross-workflow publication lock above.
    concurrency:
      group: gramdrive-candidate-signing-runner
      cancel-in-progress: false
    environment: updates-test
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      artifact_name: ${{ steps.handoff.outputs.artifact_name }}
      commit: ${{ steps.source.outputs.commit }}
      mode: ${{ steps.source.outputs.mode }}
      feed_generation: ${{ steps.source.outputs.feed_generation }}
      feed_public_key: ${{ steps.source.outputs.feed_public_key }}
    steps:
      - name: Record the runner keychain state
        shell: bash
        run: |
          set -euo pipefail
          signing_temp="$RUNNER_TEMP/gramdrive-candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -m 700 "$signing_temp"
          echo "SIGNING_TEMP=$signing_temp" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$signing_temp/signing.keychain-db" >> "$GITHUB_ENV"
          original="$(security default-keychain -d user | sed 's/^[[:space:]]*//;s/"//g')"
          echo "ORIGINAL_DEFAULT_KEYCHAIN=$original" >> "$GITHUB_ENV"
          {
            echo "ORIGINAL_KEYCHAIN_SEARCH_LIST<<GRAMDRIVE_KEYCHAIN_EOF"
            security list-keychains -d user | sed 's/^[[:space:]]*//;s/"//g'
            echo "GRAMDRIVE_KEYCHAIN_EOF"
          } >> "$GITHUB_ENV"

      - name: Checkout full protected-main history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          clean: true

      - name: Validate and select the protected-main source
        id: source
        shell: bash
        env:
          DISPATCH_MODE: ${{ inputs.mode }}
          DISPATCH_COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            [ "$GITHUB_REF" = "refs/heads/main" ]
            mode="test"
            commit="$GITHUB_SHA"
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "workflow_dispatch must run from protected main" >&2
              exit 1
            fi
            mode="$DISPATCH_MODE"
            commit="$DISPATCH_COMMIT"
          else
            echo "unsupported event: $GITHUB_EVENT_NAME" >&2
            exit 1
          fi
          case "$mode" in test|stable-candidate) ;; *) echo "invalid mode" >&2; exit 1;; esac
          if ! [[ "$commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "commit must be a full lowercase SHA-1" >&2
            exit 1
          fi
          git cat-file -e "$commit^{commit}"
          git merge-base --is-ancestor "$commit" origin/main
          git checkout --detach "$commit"
          [ "$(git rev-parse HEAD)" = "$commit" ]
          [ -z "$(git status --porcelain)" ]
          channel="test"
          generation="1"
          public_key="T8IBLvve21ObUHz78CLXdF0eWN7QgJPHd1eKlcFhqmo="
          if [ "$mode" = "stable-candidate" ]; then
            channel="stable"
            generation="$(python3 -c 'import json; print(json.load(open(".github/sparkle-stable.json"))["active_generation"])')"
            public_key="$(python3 -c 'import json; print(json.load(open(".github/sparkle-stable.json"))["active_public_key"])')"
            python3 .scripts/release/publish_sparkle.py read-stable-config \
              --config .github/sparkle-stable.json >/dev/null
          fi
          {
            echo "mode=$mode"
            echo "channel=$channel"
            echo "commit=$commit"
            echo "feed_generation=$generation"
            echo "feed_public_key=$public_key"
          } >> "$GITHUB_OUTPUT"

      - name: Restore authenticated stable feed creation state
        id: stable_state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          stable_manifest=
          if [ "${{ steps.source.outputs.mode }}" = stable-candidate ]; then
            mkdir -p .temp/build-order/stable-state
            gh api --paginate --slurp \
              "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              > .temp/build-order/stable-state/release-pages.json
            previous="$(python3 .scripts/release/select_stable_release.py \
              --mode candidate-state-head \
              --release-pages .temp/build-order/stable-state/release-pages.json)"
            if [ -n "$previous" ]; then
              gh release download "$previous" \
                --pattern stable-pages-site-manifest.json \
                --pattern stable-pages-site.attestation.json \
                --dir .temp/build-order/stable-state
              git fetch --force origin "refs/tags/$previous:refs/tags/$previous"
              previous_commit="$(git rev-list -n 1 "$previous")"
              test -n "$previous_commit"
              gh attestation verify \
                .temp/build-order/stable-state/stable-pages-site-manifest.json \
                --repo "$GITHUB_REPOSITORY" \
                --bundle .temp/build-order/stable-state/stable-pages-site.attestation.json \
                --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
                --source-digest "$previous_commit"
              stable_manifest=.temp/build-order/stable-state/stable-pages-site-manifest.json
            fi
          fi
          echo "manifest=$stable_manifest" >> "$GITHUB_OUTPUT"

      - name: Check monotonic Sparkle build ordering
        id: build_order
        run: |
          set -euo pipefail
          source .github/scripts/run-with-optional-file-argument.sh
          run_with_optional_file_argument \
            --stable-site-manifest "${{ steps.stable_state.outputs.manifest }}" \
            python3 .scripts/release/check_candidate_build_order.py \
            --mode "${{ steps.source.outputs.mode }}" \
            --git-build "$(git rev-list --count HEAD)"

      - name: Report pinned Rust toolchain
        run: |
          set -euo pipefail
          rustup show
          rustc --version
          cargo --version

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0

      - name: Install cargo-deny (pinned)
        uses: taiki-e/install-action@07b4745e0c39a41822af610387492e3e53aa222b # v2
        with:
          tool: cargo-deny@0.20.2

      - name: Run supply-chain gates before credentials exist
        run: python3 .scripts/acceptance/run_automated.py --suite supply-chain --run-id candidate-supply-chain

      - name: Restore and prove the pinned arm64 live TDLib core
        run: |
          set -euo pipefail
          test "$(uname -m)" = "x86_64"
          python3 .scripts/tdlib/restore_pinned_artifact.py \
            --cache-root "$HOME/gramdrive-ci/cache" \
            --out-dir .temp/tdlib/out
          make tdlib-smoke-link
          GRAMDRIVE_TDLIB_ARTIFACT_DIR=.temp/tdlib/out make package

      - name: Import Developer ID and create the non-interactive notary profile
        # Accepted temporary risk: security import has no non-interactive secret
        # input other than -P, so the expanded export password briefly exists in
        # process argv.  The dedicated single-job runner, disabled tracing,
        # generated throwaway keychain, RUNNER_TEMP-only decoded files, restricted
        # workflow administration, and always() cleanup are the required controls.
        shell: bash
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          cert_path="$SIGNING_TEMP/cert.p12"
          asc_key="$SIGNING_TEMP/notary.p8"
          keychain_pw="$(openssl rand -base64 32)"
          security create-keychain -p "$keychain_pw" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$keychain_pw" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')
          printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$cert_path"
          security import "$cert_path" -k "$KEYCHAIN_PATH" -P "$MACOS_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_pw" "$KEYCHAIN_PATH" >/dev/null
          rm -f "$cert_path"

          devid_ca="$SIGNING_TEMP/DeveloperIDG2CA.cer"
          devid_ca_sha256="f16cd3c54c7f83cea4bf1a3e6a0819c8aaa8e4a1528fd144715f350643d2df3a"
          curl --fail --location --silent --show-error \
            --output "$devid_ca" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          echo "$devid_ca_sha256  $devid_ca" | shasum -a 256 --check --status
          security import "$devid_ca" -k "$KEYCHAIN_PATH"
          rm -f "$devid_ca"

          printf '%s' "$APPSTORE_PRIVATE_KEY" > "$asc_key"
          xcrun notarytool store-credentials gramdrive-candidate-notary \
            --key "$asc_key" --key-id "$APPSTORE_KEY_ID" --issuer "$APPSTORE_ISSUER_ID" \
            --keychain "$KEYCHAIN_PATH"
          rm -f "$asc_key"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -c "Developer ID Application"

      - name: Build sign notarize staple and verify the requested channel
        run: |
          set -euo pipefail
          python3 .scripts/apple-app/build_app_bundle.py \
            --update-channel "${{ steps.source.outputs.channel }}" \
            --update-feed-generation "${{ steps.source.outputs.feed_generation }}" \
            --update-public-key "${{ steps.source.outputs.feed_public_key }}" \
            --build-number "${{ steps.build_order.outputs.build_number }}" \
            --notarize \
            --notary-profile gramdrive-candidate-notary \
            --notary-keychain "$KEYCHAIN_PATH"

      - name: Build the privacy-safe exact-byte candidate handoff
        id: candidate
        run: |
          set -euo pipefail
          python3 .scripts/release/build_candidate_package.py build \
            --app-dir .temp/app-packaging \
            --core-dir .temp/packaging \
            --tdlib-dir .temp/tdlib/out \
            --out-dir .temp/candidate \
            --mode "${{ steps.source.outputs.mode }}" \
            --commit "${{ steps.source.outputs.commit }}" \
            --minimum-build "${{ steps.build_order.outputs.minimum_build }}" \
            --repository "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_REF" \
            --workflow-ref "$GITHUB_WORKFLOW_REF" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT"

      - name: Attest the exact candidate subjects
        id: attest
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-checksums: .temp/candidate/SUBJECTS.sha256

      - name: Bind and reverify the attestation bundle
        run: |
          set -euo pipefail
          python3 .scripts/release/build_candidate_package.py finalize \
            --out-dir .temp/candidate \
            --attestation-bundle "${{ steps.attest.outputs.bundle-path }}"
          python3 .scripts/release/build_candidate_package.py verify \
            --out-dir .temp/candidate

      - name: Recheck monotonic ordering at the immutable handoff boundary
        run: |
          set -euo pipefail
          source .github/scripts/run-with-optional-file-argument.sh
          run_with_optional_file_argument \
            --stable-site-manifest "${{ steps.stable_state.outputs.manifest }}" \
            python3 .scripts/release/check_candidate_build_order.py \
            --mode "${{ steps.source.outputs.mode }}" \
            --candidate-build "${{ steps.build_order.outputs.build_number }}"

      - name: Name the immutable handoff
        id: handoff
        run: |
          echo "artifact_name=gramdrive-candidate-${{ steps.candidate.outputs.build }}-${{ steps.source.outputs.commit }}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Upload one immutable verified candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.handoff.outputs.artifact_name }}
          path: .temp/candidate
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
          overwrite: false

      - name: Remove all credential and workspace state
        if: always()
        shell: bash
        run: |
          set +e
          cleanup_temp="$RUNNER_TEMP/gramdrive-candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup_keychain="$cleanup_temp/signing.keychain-db"
          security delete-keychain "${KEYCHAIN_PATH:-$cleanup_keychain}" >/dev/null 2>&1
          if [ -n "${ORIGINAL_KEYCHAIN_SEARCH_LIST:-}" ]; then
            old_ifs="$IFS"; IFS=$'\n'
            # shellcheck disable=SC2086
            security list-keychains -d user -s $ORIGINAL_KEYCHAIN_SEARCH_LIST
            IFS="$old_ifs"
          fi
          if [ -n "${ORIGINAL_DEFAULT_KEYCHAIN:-}" ]; then
            security default-keychain -d user -s "$ORIGINAL_DEFAULT_KEYCHAIN"
          fi
          case "$cleanup_temp" in
            "$RUNNER_TEMP"/gramdrive-candidate-*) rm -rf "$cleanup_temp" ;;
          esac
          rm -rf .temp

  # Sole rolling-test publication boundary (TASK-260810-y3zcg8). This job can
  # mutate Releases and use the test Sparkle key, but it cannot deploy Pages,
  # read the stable key, or access any Apple signing/notarization credential.
  # Test clients are deliberately disposable: v1 is the sole test trust root.
  # A future test-key discontinuity freezes this prerelease and requires a new
  # reviewed workflow/client generation; it never bridges through stable trust.
  publish-test:
    name: publish-rolling-test-feed
    needs: candidate
    runs-on: [self-hosted, gramdrive-mac]
    environment: updates-test
    permissions:
      contents: write
    steps:
      - name: Checkout the exact verified candidate source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.candidate.outputs.commit }}
          fetch-depth: 1
          clean: true

      - name: Download only this run's immutable candidate handoff
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.candidate.outputs.artifact_name }}
          path: .temp/publication/candidate

      - name: Revalidate candidate provenance exact bytes and attestation
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 .scripts/release/build_candidate_package.py verify \
            --out-dir .temp/publication/candidate
          python3 .scripts/release/publish_sparkle.py inspect-candidate \
            --candidate-dir .temp/publication/candidate \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" \
            --commit "${{ needs.candidate.outputs.commit }}" \
            --mode "${{ needs.candidate.outputs.mode }}"
          dmg=".temp/publication/candidate/$(python3 -c 'import json; print(json.load(open(".temp/publication/candidate/candidate-manifest.json"))["dmg"]["name"])')"
          gh attestation verify "$dmg" \
            --repo "$GITHUB_REPOSITORY" \
            --bundle .temp/publication/candidate/candidate-attestation.json \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/candidate-build.yml" \
            --source-digest "${{ needs.candidate.outputs.commit }}"

      - name: Fetch the exact pinned Sparkle 2.9.5 signing tool
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/gramdrive-sparkle-tools-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -m 700 "$tools"
          curl --fail --location --silent --show-error \
            --output "$tools/Sparkle.zip" \
            https://github.com/sparkle-project/Sparkle/releases/download/2.9.5/Sparkle-for-Swift-Package-Manager.zip
          echo "34b9b2071f3de0012eca3faa3a9290bb94e62131e9a74f6dc91514a000097a6c  $tools/Sparkle.zip" | shasum -a 256 --check --status
          unzip -q "$tools/Sparkle.zip" bin/sign_update -d "$tools"
          chmod 700 "$tools/bin/sign_update"
          echo "SPARKLE_SIGN_UPDATE=$tools/bin/sign_update" >> "$GITHUB_ENV"
          echo "SPARKLE_TOOLS_DIR=$tools" >> "$GITHUB_ENV"

      - name: Prepare unsigned test feed and immutable publication assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .temp/publication/out
          dmg="${{ steps.candidate.outputs.dmg_name }}"
          stem="${dmg%.dmg}"
          notes="$stem.md"
          package="$stem.candidate.tar.gz"
          python3 .scripts/release/publish_sparkle.py write-notes \
            --candidate-dir .temp/publication/candidate \
            --output ".temp/publication/out/$notes"
          python3 .scripts/release/publish_sparkle.py pack-tree \
            --root .temp/publication/candidate \
            --output ".temp/publication/out/$package"
          cp ".temp/publication/candidate/$dmg" ".temp/publication/out/$dmg"
          if ! gh release view updates-test-v1 >/dev/null 2>&1; then
            gh release create updates-test-v1 \
              --target "${{ needs.candidate.outputs.commit }}" \
              --title "GramDrive rolling test updates v1" \
              --notes "Rolling Sparkle test channel. Build-named assets are immutable." \
              --prerelease --latest=false
          fi
          prior_url="https://github.com/$GITHUB_REPOSITORY/releases/download/updates-test-v1/test.xml"
          status="$(curl --location --silent --show-error \
            --output .temp/publication/prior-test.xml --write-out '%{http_code}' "$prior_url")"
          case "$status" in
            200) prior_feed=.temp/publication/prior-test.xml ;;
            404) rm -f .temp/publication/prior-test.xml; prior_feed= ;;
            *) echo "cannot read prior test feed: HTTP $status" >&2; exit 1 ;;
          esac
          {
            echo "PRIOR_TEST_FEED=$prior_feed"
            echo "PUBLICATION_DMG=$dmg"
            echo "PUBLICATION_NOTES=$notes"
            echo "PUBLICATION_PACKAGE=$package"
          } >> "$GITHUB_ENV"

      - name: Sign enclosure notes and complete test feed with only the test key
        env:
          SPARKLE_TEST_V1_EDDSA_PRIVATE_KEY_B64: ${{ secrets.SPARKLE_TEST_V1_EDDSA_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          key() { printf '%s' "$SPARKLE_TEST_V1_EDDSA_PRIVATE_KEY_B64" | base64 --decode; }
          key | "$SPARKLE_SIGN_UPDATE" --ed-key-file - \
            ".temp/publication/out/$PUBLICATION_DMG" > .temp/publication/dmg-signature.txt
          key | "$SPARKLE_SIGN_UPDATE" --ed-key-file - \
            ".temp/publication/out/$PUBLICATION_NOTES" > .temp/publication/notes-signature.txt
          if [ -n "$PRIOR_TEST_FEED" ]; then
            key | "$SPARKLE_SIGN_UPDATE" --verify --ed-key-file - "$PRIOR_TEST_FEED"
          fi
          source .github/scripts/run-with-optional-file-argument.sh
          run_with_optional_file_argument --prior-feed "$PRIOR_TEST_FEED" \
            python3 .scripts/release/publish_sparkle.py render-feed \
            --candidate-dir .temp/publication/candidate \
            --channel test --generation 1 --repository "$GITHUB_REPOSITORY" \
            --dmg-signature .temp/publication/dmg-signature.txt \
            --notes-signature .temp/publication/notes-signature.txt \
            --notes-name "$PUBLICATION_NOTES" \
            --publication-date "$(git show -s --format=%cD '${{ needs.candidate.outputs.commit }}')" \
            --output .temp/publication/out/test.xml
          key | "$SPARKLE_SIGN_UPDATE" --ed-key-file - .temp/publication/out/test.xml
          key | "$SPARKLE_SIGN_UPDATE" --verify --ed-key-file - .temp/publication/out/test.xml
          python3 .scripts/release/publish_sparkle.py validate-feed \
            --feed .temp/publication/out/test.xml --channel test --generation 1 \
            --repository "$GITHUB_REPOSITORY"

      - name: Publish immutable assets then atomically recover the rolling feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          upload_immutable() {
            asset="$1"
            name="$(basename "$asset")"
            if gh release view updates-test-v1 --json assets --jq '.assets[].name' | grep -Fxq "$name"; then
              mkdir -p .temp/publication/existing
              gh release download updates-test-v1 --pattern "$name" --dir .temp/publication/existing --clobber
              cmp "$asset" ".temp/publication/existing/$name"
            else
              gh release upload updates-test-v1 "$asset"
            fi
          }
          upload_immutable ".temp/publication/out/$PUBLICATION_DMG"
          upload_immutable ".temp/publication/out/$PUBLICATION_NOTES"
          upload_immutable ".temp/publication/out/$PUBLICATION_PACKAGE"

          restore_prior() {
            if [ -n "$PRIOR_TEST_FEED" ]; then
              gh release upload updates-test-v1 "$PRIOR_TEST_FEED#test.xml" --clobber
            else
              gh release delete-asset updates-test-v1 test.xml --yes >/dev/null 2>&1 || true
            fi
          }
          if ! gh release upload updates-test-v1 .temp/publication/out/test.xml --clobber; then
            restore_prior
            exit 1
          fi
          if ! curl --fail --location --silent --show-error \
            --output .temp/publication/published-test.xml \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/updates-test-v1/test.xml?run=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            || ! cmp .temp/publication/out/test.xml .temp/publication/published-test.xml; then
            restore_prior
            exit 1
          fi

      - name: Remove publication and key-tool state
        if: always()
        run: |
          case "${SPARKLE_TOOLS_DIR:-}" in "$RUNNER_TEMP"/gramdrive-sparkle-tools-*) rm -rf "$SPARKLE_TOOLS_DIR" ;; esac
          rm -rf .temp/publication
