# Shared core CI — mirrors the relux-works/barycenter pattern: per-component
# jobs, each running the ONE pinned acceptance entrypoint (never an ad-hoc list
# of cargo commands), each uploading its run's provenance as an artifact.
#
# The gate a PR sees is the gate a developer runs before pushing:
#   python3 .scripts/acceptance/run_automated.py --suite all      --run-id local-all
#   python3 .scripts/acceptance/run_automated.py --suite security --run-id local-security
# CI adds --require-clean (so the recorded commit is the tested tree) and pins
# every tool; it invents no step of its own.
#
# Making these checks block a merge is a branch-protection rule, not something a
# workflow file can grant itself: mark the "rust-core" and "secret-scan" jobs as
# required status checks on main. See README "Continuous integration".
name: CI

# Gate everything targeting main, and main itself after a merge. The
# pull_request trigger is what a required-check rule attaches to (AC: a PR
# cannot merge while a required job fails).
on:
  pull_request:
  push:
    branches: [main]

# Least privilege for the whole workflow: it only reads the checkout. No job
# here writes to the repo, publishes anything, or mints an OIDC token. Release
# signing/attestation is a separate tag-triggered workflow with its own
# elevated permissions (TASK-260715-3bhbkv).
permissions:
  contents: read

# One in-flight run per ref. A new push to a PR cancels the now-moot previous
# run; runs on main are never cancelled, so every merged commit keeps a complete
# gate record.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust-core:
    # SELF-HOSTED (TASK-260719-1dwaj8). GitHub-hosted runners are blocked by
    # org billing (macOS and Linux both: runs 29700024728 / 29700024758 failed
    # at start with the billing error), so every job runs on the persistent
    # self-hosted mac runner `relux-gramdrive` (label gramdrive-mac).
    #
    # DEVIATION from the arm64 reference host (POL-5 / DEC-017): that runner is
    # an x86_64 Mac, and this job's gates (fmt, clippy, test, architecture,
    # cargo-deny/POL-6, traceability, script self-tests — everything except the
    # secret scan below) compile and test the platform-neutral core natively
    # for x86_64. The shipped target is unchanged: arm64 artifacts are
    # cross-compiled and arch-verified (lipo/file(1)) in native-ci and release.
    name: rust-core
    runs-on: [self-hosted, gramdrive-mac]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install the pinned Rust toolchain
        # The bootstrap restores a missing runner-owned rustup installation
        # without sourcing an interactive shell profile, then installs the
        # exact channel/components declared in rust-toolchain.toml.
        #
        # No hosted-cache step (the Swatinem/rust-cache the hosted runner used):
        # the cache service sits behind the same blocked billing, and on a
        # persistent runner incremental state lives in the machine-local
        # CARGO_TARGET_DIR the runner's .env sets — still speed only, never
        # correctness, for the same reason as before: toolchain and lockfile
        # are pinned, and cargo fingerprints rebuilds.
        run: .github/scripts/bootstrap-rust-toolchain.sh

      - name: Install cargo-deny (pinned)
        uses: taiki-e/install-action@07b4745e0c39a41822af610387492e3e53aa222b # v2
        with:
          tool: cargo-deny@0.20.2

      - name: Run acceptance suite (all)
        run: python3 .scripts/acceptance/run_automated.py --suite all --require-clean --run-id ci-all

      - name: Upload acceptance provenance
        # Always, even on failure — the provenance of a red run is the point
        # (NFR-052: a result must be attributable to a commit). if-no-files-found
        # error turns a runner that never wrote provenance (a silently skipped
        # gate) into a failure instead of a green run with an empty artifact.
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: acceptance-ci-all
          path: .temp/acceptance/ci-all
          if-no-files-found: error
          retention-days: 14

  secret-scan:
    # Portable, no Rust toolchain. Its own component because it is the only
    # gate needing gitleaks, and it is a merge-boundary check.
    #
    # DECISION (TASK-260719-1dwaj8): this job moves to the self-hosted mac
    # runner rather than staying on ubuntu-24.04 — the billing block covers
    # hosted Linux minutes too (this exact job failed at start with the billing
    # error on run 29700024728), and gitleaks is portable. Same version pin,
    # same checksum discipline; the binary is the darwin_x64 release asset and
    # the checksum tool is macOS's shasum.
    name: secret-scan
    runs-on: [self-hosted, gramdrive-mac]
    steps:
      - name: Checkout full history
        # gitleaks git scans every commit; a shallow clone would silently scan
        # only the tip and miss a secret introduced earlier on the branch.
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install gitleaks (pinned + checksum-verified)
        # Not the Marketplace action: gitleaks-action gates organisation use
        # behind a licence key. The release tarball is pinned by version and
        # verified against a sha256 committed in this file, so a tampered
        # download fails the step instead of scanning with an unknown binary.
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: dfe101a4db2255fc85120ac7f3d25e4342c3c20cf749f2c20a18081af1952709
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_darwin_x64.tar.gz"
          curl -sSfL "$url" -o gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | shasum -a 256 -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf gitleaks.tar.gz -C "$HOME/.local/bin" gitleaks
          chmod 0755 "$HOME/.local/bin/gitleaks"
          rm -f gitleaks.tar.gz
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/gitleaks" version

      - name: Run acceptance suite (security)
        run: python3 .scripts/acceptance/run_automated.py --suite security --require-clean --run-id ci-security

      - name: Upload acceptance provenance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: acceptance-ci-security
          path: .temp/acceptance/ci-security
          if-no-files-found: error
          retention-days: 14
