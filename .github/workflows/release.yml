name: stable-release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      operation:
        description: Promote a tested candidate or redeploy an immutable stable site
        required: true
        type: choice
        options:
          - promote
          - rotate-key
          - redeploy-site
      tag:
        description: Existing v* tag to recover or redeploy
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: gramdrive-stable-publication
  cancel-in-progress: false

env:
  TEST_FEED_GENERATION: "1"
  TEST_PUBLIC_KEY: "T8IBLvve21ObUHz78CLXdF0eWN7QgJPHd1eKlcFhqmo="

jobs:
  # Approval is before either stable private-key access or Release mutation.
  # This job has contents:write but intentionally has no Pages capability.
  promote:
    name: approve-sign-and-promote-exact-candidate
    if: github.event_name == 'push' || inputs.operation == 'promote' || inputs.operation == 'rotate-key'
    runs-on: [self-hosted, gramdrive-mac]
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.source.outputs.version }}
      build: ${{ steps.candidate.outputs.build }}
      tag: ${{ steps.source.outputs.tag }}
    steps:
      - name: Checkout full protected-main history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          clean: true

      - name: Validate the immutable release tag and protected-main source
        id: source
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
          DISPATCH_OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            tag="$GITHUB_REF_NAME"; requested_operation=auto
          else
            tag="$DISPATCH_TAG"; requested_operation="$DISPATCH_OPERATION"
          fi
          if ! [[ "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "stable promotion requires an exact vMAJOR.MINOR.PATCH tag" >&2
            exit 1
          fi
          git fetch --force origin main "refs/tags/$tag:refs/tags/$tag"
          commit="$(git rev-list -n 1 "$tag")"
          test -n "$commit"
          git merge-base --is-ancestor "$commit" origin/main
          git checkout --detach "$commit"
          test -z "$(git status --porcelain)"
          test "$(python3 -c 'import json; print(json.load(open("apple/GramDriveSupport/Version.json"))["marketing_version"])')" = "${BASH_REMATCH[1]}"
          generation="$(python3 -c 'import json; print(json.load(open(".github/sparkle-stable.json"))["active_generation"])')"
          public_key="$(python3 -c 'import json; print(json.load(open(".github/sparkle-stable.json"))["active_public_key"])')"
          python3 .scripts/release/publish_sparkle.py read-stable-config \
            --config .github/sparkle-stable.json >/dev/null
          {
            echo "tag=$tag"
            echo "version=${BASH_REMATCH[1]}"
            echo "commit=$commit"
            echo "requested_operation=$requested_operation"
            echo "generation=$generation"
            echo "public_key=$public_key"
          } >> "$GITHUB_OUTPUT"

      - name: Download immutable candidates from the rolling test prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .temp/stable/downloads
          gh release download "updates-test-v$TEST_FEED_GENERATION" \
            --pattern 'GramDrive-*.candidate.tar.gz' \
            --dir .temp/stable/downloads

      - name: Select and revalidate the exact tested stable candidate
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          matches=0
          for archive in .temp/stable/downloads/GramDrive-*.candidate.tar.gz; do
            scratch=".temp/stable/try-$(basename "$archive" .tar.gz)"
            rm -rf "$scratch"
            python3 .scripts/release/publish_sparkle.py unpack-tree \
              --archive "$archive" --output "$scratch" --flat
            if python3 .scripts/release/publish_sparkle.py inspect-candidate \
              --candidate-dir "$scratch" --repository "$GITHUB_REPOSITORY" \
              --commit "${{ steps.source.outputs.commit }}" \
              --mode stable-candidate --version "${{ steps.source.outputs.version }}" \
              > .temp/stable/selected-output.txt 2>/dev/null; then
              matches=$((matches + 1))
              rm -rf .temp/stable/candidate
              mv "$scratch" .temp/stable/candidate
              cp "$archive" .temp/stable/selected-candidate.tar.gz
            else
              rm -rf "$scratch"
            fi
          done
          test "$matches" -eq 1
          python3 .scripts/release/build_candidate_package.py verify \
            --out-dir .temp/stable/candidate
          python3 .scripts/release/publish_sparkle.py inspect-candidate \
            --candidate-dir .temp/stable/candidate --repository "$GITHUB_REPOSITORY" \
            --commit "${{ steps.source.outputs.commit }}" \
            --mode stable-candidate --version "${{ steps.source.outputs.version }}"
          [ "$(python3 -c 'import json; print(json.load(open(".temp/stable/candidate/app-manifest.json"))["sparkle"].get("generation", 1))')" = "${{ steps.source.outputs.generation }}" ]
          [ "$(python3 -c 'import json; print(json.load(open(".temp/stable/candidate/app-manifest.json"))["sparkle"]["public_key"])')" = "${{ steps.source.outputs.public_key }}" ]
          dmg=".temp/stable/candidate/$(python3 -c 'import json; print(json.load(open(".temp/stable/candidate/candidate-manifest.json"))["dmg"]["name"])')"
          gh attestation verify "$dmg" \
            --repo "$GITHUB_REPOSITORY" \
            --bundle .temp/stable/candidate/candidate-attestation.json \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/candidate-build.yml" \
            --source-digest "${{ steps.source.outputs.commit }}"

      - name: Prove the tested prerelease DMG is byte-identical
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .temp/stable/test-release
          dmg_name="${{ steps.candidate.outputs.dmg_name }}"
          notes_name="${dmg_name%.dmg}.md"
          gh release download "updates-test-v$TEST_FEED_GENERATION" \
            --pattern "$dmg_name" \
            --pattern "$notes_name" \
            --pattern test.xml \
            --dir .temp/stable/test-release
          cmp \
            ".temp/stable/candidate/$dmg_name" \
            ".temp/stable/test-release/$dmg_name"
          echo "${{ steps.candidate.outputs.dmg_sha256 }}  .temp/stable/test-release/$dmg_name" | shasum -a 256 --check --status
          python3 .scripts/release/publish_sparkle.py verify-test-offer \
            --candidate-dir .temp/stable/candidate \
            --feed .temp/stable/test-release/test.xml \
            --notes ".temp/stable/test-release/$notes_name" \
            --generation "$TEST_FEED_GENERATION" \
            --test-public-key "$TEST_PUBLIC_KEY" \
            --repository "$GITHUB_REPOSITORY"

      - name: Fetch the exact pinned Sparkle 2.9.5 signing tool
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/gramdrive-stable-sparkle-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -m 700 "$tools"
          curl --fail --location --silent --show-error \
            --output "$tools/Sparkle.zip" \
            https://github.com/sparkle-project/Sparkle/releases/download/2.9.5/Sparkle-for-Swift-Package-Manager.zip
          echo "34b9b2071f3de0012eca3faa3a9290bb94e62131e9a74f6dc91514a000097a6c  $tools/Sparkle.zip" | shasum -a 256 --check --status
          unzip -q "$tools/Sparkle.zip" bin/sign_update -d "$tools"
          chmod 700 "$tools/bin/sign_update"
          echo "SPARKLE_SIGN_UPDATE=$tools/bin/sign_update" >> "$GITHUB_ENV"
          echo "SPARKLE_TOOLS_DIR=$tools" >> "$GITHUB_ENV"

      - name: Restore the last complete stable site without mutating it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .temp/stable/site
          previous="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '[.[] | select(.tag_name != "${{ steps.source.outputs.tag }}" and any(.assets[]?; .name == "stable-pages-site.attestation.json"))] | sort_by(.published_at) | last | .tag_name // empty')"
          if [ -n "$previous" ]; then
            gh release download "$previous" \
              --pattern stable-pages-site.tar.gz \
              --pattern stable-pages-site-manifest.json \
              --pattern stable-pages-site-manifest.signature.txt \
              --pattern stable-pages-site.attestation.json \
              --dir .temp/stable/previous
            git fetch --force origin "refs/tags/$previous:refs/tags/$previous"
            previous_commit="$(git rev-list -n 1 "$previous")"
            for subject in stable-pages-site.tar.gz stable-pages-site-manifest.json stable-pages-site-manifest.signature.txt; do
              gh attestation verify ".temp/stable/previous/$subject" \
                --repo "$GITHUB_REPOSITORY" \
                --bundle .temp/stable/previous/stable-pages-site.attestation.json \
                --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
                --source-digest "$previous_commit"
            done
            rm -rf .temp/stable/site
            python3 .scripts/release/publish_sparkle.py unpack-tree \
              --archive .temp/stable/previous/stable-pages-site.tar.gz \
              --output .temp/stable/site
            python3 .scripts/release/publish_sparkle.py verify-site \
              --site .temp/stable/site \
              --archive .temp/stable/previous/stable-pages-site.tar.gz \
              --manifest .temp/stable/previous/stable-pages-site-manifest.json \
              --manifest-signature .temp/stable/previous/stable-pages-site-manifest.signature.txt \
              --repository "$GITHUB_REPOSITORY"
          fi
          test -d .temp/stable/site

      - name: Enforce the authenticated stable generation transition
        id: transition
        run: |
          set -euo pipefail
          prior_args=()
          if [ -f .temp/stable/previous/stable-pages-site-manifest.json ]; then
            prior_args=(--previous-manifest .temp/stable/previous/stable-pages-site-manifest.json)
          fi
          python3 .scripts/release/publish_sparkle.py plan-transition \
            --config .github/sparkle-stable.json \
            --requested-operation "${{ steps.source.outputs.requested_operation }}" \
            "${prior_args[@]}"

      - name: Match the tested candidate to the enforced transition
        run: |
          set -euo pipefail
          [ "${{ steps.source.outputs.generation }}" = "${{ steps.transition.outputs.generation }}" ]
          [ "${{ steps.source.outputs.public_key }}" = "${{ steps.transition.outputs.public_key }}" ]

      - name: Prepare active notes and optional one-time old-generation bridge notes
        run: |
          set -euo pipefail
          generation="${{ steps.source.outputs.generation }}"
          notes="GramDrive-${{ steps.candidate.outputs.version }}-${{ steps.candidate.outputs.build }}.md"
          notes_dir=".temp/stable/site/updates/stable/v$generation/notes"
          mkdir -p "$notes_dir"
          python3 .scripts/release/publish_sparkle.py write-notes \
            --candidate-dir .temp/stable/candidate --output "$notes_dir/$notes"
          if [ "${{ steps.transition.outputs.operation }}" = rotate-key ]; then
            old_generation="${{ steps.transition.outputs.previous_generation }}"
            old_feed=".temp/stable/site/updates/stable/v$old_generation/stable.xml"
            test -f "$old_feed"
            test -f .temp/stable/previous/stable-pages-site-manifest.json
            python3 - "$old_generation" "${{ steps.transition.outputs.previous_public_key }}" <<'PY'
          import json, sys
          manifest = json.load(open(".temp/stable/previous/stable-pages-site-manifest.json"))
          keys = {str(item["generation"]): item["public_key"] for item in manifest["feed_keys"]}
          assert keys.get(sys.argv[1]) == sys.argv[2], "old generation/public key does not match the authenticated prior site"
          PY
            old_notes_dir=".temp/stable/site/updates/stable/v$old_generation/notes"
            mkdir -p "$old_notes_dir"
            cp "$notes_dir/$notes" "$old_notes_dir/$notes"
          fi
          echo "STABLE_NOTES=$notes" >> "$GITHUB_ENV"

      - name: Sign active feed and optional old-key bridge under release approval
        env:
          SPARKLE_STABLE_EDDSA_PRIVATE_KEY_B64: ${{ secrets.SPARKLE_STABLE_EDDSA_PRIVATE_KEY_B64 || secrets.SPARKLE_STABLE_V1_EDDSA_PRIVATE_KEY_B64 }}
          SPARKLE_STABLE_PREVIOUS_EDDSA_PRIVATE_KEY_B64: ${{ secrets.SPARKLE_STABLE_PREVIOUS_EDDSA_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          sign_generation() {
            generation="$1"; key_value="$2"; require_prior="$3"
            test -n "$key_value"
            feed_dir=".temp/stable/site/updates/stable/v$generation"
            feed="$feed_dir/stable.xml"
            prior_args=()
            if [ -f "$feed" ]; then
              prior=".temp/stable/prior-stable-v$generation.xml"
              cp "$feed" "$prior"
              printf '%s' "$key_value" | base64 --decode | \
                "$SPARKLE_SIGN_UPDATE" --verify --ed-key-file - "$prior"
              prior_args=(--prior-feed "$prior")
            elif [ "$require_prior" = yes ]; then
              echo "rotation refuses to create a bridge without the authenticated old feed" >&2
              exit 1
            fi
            printf '%s' "$key_value" | base64 --decode | \
              "$SPARKLE_SIGN_UPDATE" --ed-key-file - \
              ".temp/stable/candidate/${{ steps.candidate.outputs.dmg_name }}" \
              > ".temp/stable/dmg-signature-v$generation.txt"
            printf '%s' "$key_value" | base64 --decode | \
              "$SPARKLE_SIGN_UPDATE" --ed-key-file - \
              "$feed_dir/notes/$STABLE_NOTES" > ".temp/stable/notes-signature-v$generation.txt"
            python3 .scripts/release/publish_sparkle.py render-feed \
              --candidate-dir .temp/stable/candidate \
              --channel stable --generation "$generation" \
              --repository "$GITHUB_REPOSITORY" \
              --dmg-signature ".temp/stable/dmg-signature-v$generation.txt" \
              --notes-signature ".temp/stable/notes-signature-v$generation.txt" \
              --notes-name "$STABLE_NOTES" \
              --publication-date "$(git show -s --format=%cD '${{ steps.source.outputs.commit }}')" \
              "${prior_args[@]}" --output "$feed"
            printf '%s' "$key_value" | base64 --decode | "$SPARKLE_SIGN_UPDATE" --ed-key-file - "$feed"
            printf '%s' "$key_value" | base64 --decode | "$SPARKLE_SIGN_UPDATE" --verify --ed-key-file - "$feed"
            python3 .scripts/release/publish_sparkle.py validate-feed \
              --feed "$feed" --channel stable --generation "$generation" \
              --repository "$GITHUB_REPOSITORY"
          }
          if [ "${{ steps.transition.outputs.operation }}" = rotate-key ]; then
            sign_generation \
              "${{ steps.transition.outputs.previous_generation }}" \
              "$SPARKLE_STABLE_PREVIOUS_EDDSA_PRIVATE_KEY_B64" yes
          fi
          sign_generation \
            "${{ steps.source.outputs.generation }}" \
            "$SPARKLE_STABLE_EDDSA_PRIVATE_KEY_B64" no

      - name: Freeze authenticate and verify the complete Pages site before mutation
        env:
          SPARKLE_STABLE_EDDSA_PRIVATE_KEY_B64: ${{ secrets.SPARKLE_STABLE_EDDSA_PRIVATE_KEY_B64 || secrets.SPARKLE_STABLE_V1_EDDSA_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          find .temp/stable/site -type l -print -quit | grep -q . && exit 1 || true
          python3 .scripts/release/publish_sparkle.py pack-tree \
            --root .temp/stable/site --output .temp/stable/stable-pages-site.tar.gz
          key_args=()
          if [ -f .temp/stable/previous/stable-pages-site-manifest.json ]; then
            while IFS= read -r binding; do key_args+=(--key "$binding"); done < <(
              python3 - <<'PY'
          import json
          manifest = json.load(open(".temp/stable/previous/stable-pages-site-manifest.json"))
          for item in manifest["feed_keys"]:
              print(f'{item["generation"]}={item["public_key"]}')
          PY
            )
          fi
          key_args+=(--key "${{ steps.source.outputs.generation }}=${{ steps.source.outputs.public_key }}")
          if [ "${{ steps.transition.outputs.operation }}" = rotate-key ]; then
            key_args+=(--key "${{ steps.transition.outputs.previous_generation }}=${{ steps.transition.outputs.previous_public_key }}")
          fi
          python3 .scripts/release/publish_sparkle.py write-site-manifest \
            --site .temp/stable/site \
            --archive .temp/stable/stable-pages-site.tar.gz \
            "${key_args[@]}" \
            --signer-generation "${{ steps.source.outputs.generation }}" \
            --output .temp/stable/stable-pages-site-manifest.json
          printf '%s' "$SPARKLE_STABLE_EDDSA_PRIVATE_KEY_B64" | base64 --decode | \
            "$SPARKLE_SIGN_UPDATE" --ed-key-file - \
            .temp/stable/stable-pages-site-manifest.json \
            > .temp/stable/stable-pages-site-manifest.signature.txt
          python3 .scripts/release/publish_sparkle.py verify-site \
            --site .temp/stable/site \
            --archive .temp/stable/stable-pages-site.tar.gz \
            --manifest .temp/stable/stable-pages-site-manifest.json \
            --manifest-signature .temp/stable/stable-pages-site-manifest.signature.txt \
            --repository "$GITHUB_REPOSITORY"
          (
            cd .temp/stable
            shasum -a 256 \
              stable-pages-site.tar.gz \
              stable-pages-site-manifest.json \
              stable-pages-site-manifest.signature.txt \
              > STABLE-SITE-SUBJECTS.sha256
          )

      - name: Attest the exact authenticated site recovery subjects
        id: attest_site
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-checksums: .temp/stable/STABLE-SITE-SUBJECTS.sha256

      - name: Freeze the site attestation bundle
        run: cp "${{ steps.attest_site.outputs.bundle-path }}" .temp/stable/stable-pages-site.attestation.json

      - name: Publish exact immutable stable Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.source.outputs.tag }}"
          dmg=".temp/stable/candidate/${{ steps.candidate.outputs.dmg_name }}"
          package=".temp/stable/${{ steps.candidate.outputs.dmg_name }}.candidate.tar.gz"
          cp .temp/stable/selected-candidate.tar.gz "$package"
          notes=".temp/stable/site/updates/stable/v${{ steps.source.outputs.generation }}/notes/$STABLE_NOTES"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --verify-tag --latest \
              --title "GramDrive ${{ steps.source.outputs.version }}" \
              --notes-file "$notes"
          fi
          upload_immutable() {
            asset="$1"; name="$2"
            if gh release view "$tag" --json assets --jq '.assets[].name' | grep -Fxq "$name"; then
              mkdir -p .temp/stable/existing
              gh release download "$tag" --pattern "$name" --dir .temp/stable/existing --clobber
              cmp "$asset" ".temp/stable/existing/$name"
            else
              gh release upload "$tag" "$asset#$name"
            fi
          }
          upload_immutable "$dmg" "${{ steps.candidate.outputs.dmg_name }}"
          upload_immutable "$package" "${{ steps.candidate.outputs.dmg_name }}.candidate.tar.gz"
          upload_immutable "$notes" "$STABLE_NOTES"
          upload_immutable .temp/stable/stable-pages-site.tar.gz stable-pages-site.tar.gz
          upload_immutable .temp/stable/stable-pages-site-manifest.json stable-pages-site-manifest.json
          upload_immutable .temp/stable/stable-pages-site-manifest.signature.txt stable-pages-site-manifest.signature.txt
          if gh release view "$tag" --json assets --jq '.assets[].name' | grep -Fxq stable-pages-site.attestation.json; then
            gh release download "$tag" --pattern stable-pages-site.attestation.json \
              --dir .temp/stable/existing --clobber
            for subject in stable-pages-site.tar.gz stable-pages-site-manifest.json stable-pages-site-manifest.signature.txt; do
              gh attestation verify ".temp/stable/$subject" \
                --repo "$GITHUB_REPOSITORY" \
                --bundle .temp/stable/existing/stable-pages-site.attestation.json \
                --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
                --source-digest "${{ steps.source.outputs.commit }}"
            done
            cp .temp/stable/existing/stable-pages-site.attestation.json \
              .temp/stable/stable-pages-site.attestation.json
          fi
          upload_immutable .temp/stable/stable-pages-site.attestation.json stable-pages-site.attestation.json

      - name: Upload the complete site for isolated Pages deployment
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: .temp/stable/site

      - name: Remove stable signing and candidate state
        if: always()
        run: |
          case "${SPARKLE_TOOLS_DIR:-}" in "$RUNNER_TEMP"/gramdrive-stable-sparkle-*) rm -rf "$SPARKLE_TOOLS_DIR" ;; esac
          rm -rf .temp/stable

  # Recovery never regenerates or re-signs a feed. After release approval it
  # materializes the exact complete-site archive frozen on the selected stable
  # Release, so an old valid Pages deployment remains recoverable even after
  # its candidate has aged out of the eleven-item rolling test feed.
  recover-pages:
    name: approve-exact-stable-site-redeployment
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'redeploy-site'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - name: Checkout publication verifier
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 1
          clean: true

      - name: Download and safely materialize the immutable complete site
        env:
          GH_TOKEN: ${{ github.token }}
          RECOVERY_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if ! [[ "$RECOVERY_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "site recovery requires an exact vMAJOR.MINOR.PATCH tag" >&2
            exit 1
          fi
          mkdir -p .temp/stable-recovery
          gh release download "$RECOVERY_TAG" \
            --pattern stable-pages-site.tar.gz \
            --pattern stable-pages-site-manifest.json \
            --pattern stable-pages-site-manifest.signature.txt \
            --pattern stable-pages-site.attestation.json \
            --dir .temp/stable-recovery
          git fetch --force origin "refs/tags/$RECOVERY_TAG:refs/tags/$RECOVERY_TAG"
          recovery_commit="$(git rev-list -n 1 "$RECOVERY_TAG")"
          for subject in stable-pages-site.tar.gz stable-pages-site-manifest.json stable-pages-site-manifest.signature.txt; do
            gh attestation verify ".temp/stable-recovery/$subject" \
              --repo "$GITHUB_REPOSITORY" \
              --bundle .temp/stable-recovery/stable-pages-site.attestation.json \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-digest "$recovery_commit"
          done
          python3 .scripts/release/publish_sparkle.py unpack-tree \
            --archive .temp/stable-recovery/stable-pages-site.tar.gz \
            --output .temp/stable-recovery/site
          python3 .scripts/release/publish_sparkle.py verify-site \
            --site .temp/stable-recovery/site \
            --archive .temp/stable-recovery/stable-pages-site.tar.gz \
            --manifest .temp/stable-recovery/stable-pages-site-manifest.json \
            --manifest-signature .temp/stable-recovery/stable-pages-site-manifest.signature.txt \
            --repository "$GITHUB_REPOSITORY"

      - name: Upload the exact recovered site for isolated Pages deployment
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: .temp/stable-recovery/site

  # This is the only job in the repository with Pages/OIDC capability. It has
  # neither contents:write nor any private key and can deploy only the complete
  # artifact prepared after release-environment approval.
  deploy-pages:
    name: deploy-complete-stable-site
    needs: [promote, recover-pages]
    if: always() && (needs.promote.result == 'success' || needs.recover-pages.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the complete approved site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
